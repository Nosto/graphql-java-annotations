# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Publish

on:
  workflow_dispatch:
    branches: [ master ]

jobs:
  publish:
    # The infra-ci runners carry the AWS credentials the CodeArtifact action needs.
    runs-on:
      group: infra-ci
      labels: [self-hosted, linux, arm64, medium]
    environment: prod
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'zulu'
    - name: Set up CodeArtifact
      uses: Nosto/github-actions/actions/codeartifact@main
      with:
        domain: ${{ vars.CODEARTIFACT_DOMAIN }}
        domain-owner: ${{ vars.CODEARTIFACT_DOMAIN_OWNER }}
        region: ${{ vars.CODEARTIFACT_REGION || 'us-east-1' }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Publish with Gradle
      run: ./gradlew publishMavenPublicationToCodeartifactRepository
